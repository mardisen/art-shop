name: Run Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        microservices:
          - "./auth"
          - "./bookmark"
          - "./gateway"
          - "./institute"
          - "./workshop"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.13.6"
          working-directory: ${{ matrix.microservices }}

      - name: Install the project
        working-directory: ${{ matrix.microservices }}
        run: ls || uv sync --locked --all-extras --dev

      - name: Run Tests
        working-directory: ${{ matrix.microservices }}
        run: uv run pytest