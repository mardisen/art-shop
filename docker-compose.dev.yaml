services:
  db:
    image: postgres
    container_name: art-shop-postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: fastapi
    ports:
      - 5432:5432
    networks:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - backend
  
  db_seed:
    image: artshop/backend
    depends_on:
      - db
    restart: "no"
    entrypoint: [ "python", "app/cli.py" ]
    build:
      context: backend
      dockerfile: ./Dockerfile
    networks:
      - backend
  
  backend:
    image: artshop/backend
    depends_on:
      - db
    build:
      context: backend
      dockerfile: ./Dockerfile
    ports:
      - 8000:80
    networks:
      - backend


networks:
  backend:
    driver: bridge
