[project]
name = "workshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "geopy>=2.5.0",
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "python-dateutil>=3.0.0",
    "sqlmodel>=0.0.48",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.fastapi]
entrypoint = "app.main:app"
