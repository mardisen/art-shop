services:
  db:
    image: postgres
    container_name: "$SERVICE_NAME-postgres"
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: fastapi
    ports:
      - 5432:5432
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d fastapi"]
      interval: 20s
      timeout: 5s
      retries: 5
  
