  redis: 
    image: redislabs/redismod
    ports:
      - 6379:6379
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    name: artshop-$SERVICE_NAME-private
    driver: bridge
    internal: false
  public:
    name: artshop-$SERVICE_NAME-public
    driver: bridge